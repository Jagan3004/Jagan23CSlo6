# Workflow Name
name: Deploy Static Website to EC2

# Trigger when code is pushed to main
on:
  push:
    branches:
      - main

jobs:

  deploy:

    # GitHub runner machine
    runs-on: ubuntu-latest

    steps:

      # Step 1 - Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Copy HTML file to EC2
      - name: Copy File to EC2
        uses: appleboy/scp-action@v0.1.7
        with:

          # EC2 Public IP
          host: ${{ secrets.EC2_HOST }}

          # Ubuntu username
          username: ${{ secrets.EC2_USER }}

          # PEM private key
          key: ${{ secrets.EC2_KEY }}

          # File inside repository
          source: "test.html"

          # Temporary EC2 location
          target: "/home/ubuntu"

      # Step 3 - Deploy to NGINX
      - name: Deploy to NGINX
        uses: appleboy/ssh-action@v1.0.3
        with:

          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |

            echo "Starting Deployment"

            # Copy HTML file as index.html
            sudo cp /home/ubuntu/test.html /var/www/html/index.html

            # Permissions
            sudo chmod 644 /var/www/html/index.html

            # Restart NGINX
            sudo systemctl restart nginx

            echo "Deployment Successful"
